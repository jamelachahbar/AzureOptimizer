[project]
name = "azure-cost-optimizer"
version = "1.0.0"
description = "Azure Cost Optimizer - Intelligent Azure cost management and optimization recommendations"
requires-python = ">=3.11"
authors = [
    { name = "Azure Optimizer Team", email = "team@azureoptimizer.com" }
]
keywords = ["azure", "cost-optimization", "finops", "advisor", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Flask",
]

dependencies = [
    # ==========================================================================
    # Azure SDKs - Core Management
    # ==========================================================================
    "azure-core>=1.30.0",
    "azure-identity>=1.17.0",
    "azure-mgmt-core>=1.4.0",
    "azure-mgmt-advisor>=9.0.0",
    "azure-mgmt-compute>=31.0.0",
    "azure-mgmt-costmanagement>=4.0.1",
    "azure-mgmt-monitor>=6.0.2",
    "azure-mgmt-network>=25.0.0",
    "azure-mgmt-resource>=23.1.0",
    "azure-mgmt-sql>=3.0.1",
    "azure-mgmt-storage>=21.0.0",
    "azure-mgmt-subscription>=3.1.0",
    
    # ==========================================================================
    # Azure SDKs - Monitoring & Storage
    # ==========================================================================
    "azure-monitor-query>=1.4.0",
    "azure-storage-blob>=12.21.0",
    "azure-storage-file-datalake>=12.16.0",
    "applicationinsights>=0.11.0",
    
    # ==========================================================================
    # Microsoft Agent Framework (AI Foundry Agents with MCP tools)
    # Docs: https://learn.microsoft.com/azure/ai-foundry/agents
    # MCP Tools: MCPStdioTool, MCPStreamableHTTPTool
    # ==========================================================================
    "agent-framework",
    "azure-ai-projects>=1.0.0",
    
    # ==========================================================================
    # OpenAI & AI
    # ==========================================================================
    "openai>=1.0.0",
    
    # ==========================================================================
    # Web Framework - Flask
    # ==========================================================================
    "Flask>=3.0.0",
    "Flask-Cors>=4.0.0",
    "gunicorn>=21.0.0",
    "Werkzeug>=3.0.0",
    
    # ==========================================================================
    # Data Science & ML
    # ==========================================================================
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "matplotlib>=3.7.0",
    "statsmodels>=0.14.0",
    
    # ==========================================================================
    # Utilities
    # ==========================================================================
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "PyYAML>=6.0.0",
    "cachetools>=5.3.0",
    "tenacity>=8.0.0",
    "rich>=13.0.0",
    "prettytable>=3.10.0",
    
    # ==========================================================================
    # Database & SQL
    # ==========================================================================
    "pyodbc>=5.1.0",
    "SQLAlchemy>=2.0.0",
    
    # ==========================================================================
    # Authentication & Security
    # ==========================================================================
    "msal>=1.28.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "azure_cost_optimizer",
    "autogen",
    "configs",
    "policies",
    "src",
]

[tool.uv]
# UV-specific configuration for faster installs
no-cache = false
compile-bytecode = true

[tool.black]
line-length = 100
target-version = ['py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line length handled by black

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
