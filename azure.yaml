# Azure Developer CLI (azd) configuration
# Run 'azd up' to deploy the entire application stack

name: azure-cost-optimizer
metadata:
  template: azure-cost-optimizer@1.0.0

# Infrastructure configuration
infra:
  provider: bicep
  path: infra-azd
  module: main

# Services configuration
services:
  # Flask Backend API
  backend:
    project: ui/backend
    language: py
    host: containerapp
    docker:
      path: Dockerfile
      remoteBuild: true
      context: .

  # React Frontend
  frontend:
    project: ui/frontend
    language: js
    host: containerapp
    docker:
      path: Dockerfile
      remoteBuild: true
      context: .

# Hooks for deployment lifecycle
hooks:
  # Run before infrastructure provisioning
  preprovision:
    windows:
      shell: pwsh
      run: |
        Write-Host "Preparing for provisioning..."
        Write-Host "Environment: $env:AZURE_ENV_NAME"

  # Run after infrastructure provisioning
  postprovision:
    windows:
      shell: pwsh
      run: |
        Write-Host "Infrastructure provisioned successfully!"
        Write-Host "Resource Group: $env:AZURE_RESOURCE_GROUP"
        Write-Host "Container Registry: $env:AZURE_CONTAINER_REGISTRY_ENDPOINT"

  # Run before deployment
  predeploy:
    windows:
      shell: pwsh
      run: |
        Write-Host "Starting pre-deployment setup..."
        # Validate pyproject.toml exists
        if (Test-Path "ui/backend/pyproject.toml") {
          Write-Host "pyproject.toml found - using UV for package installation"
        }

  # Run after deployment
  postdeploy:
    windows:
      shell: pwsh
      run: |
        Write-Host "Deployment completed!"
        Write-Host "Frontend URL: $env:SERVICE_FRONTEND_URI"
        Write-Host "Backend URL: $env:SERVICE_BACKEND_URI"
        Write-Host "AI Project: $env:AZURE_AI_PROJECT_ENDPOINT"

# Pipeline configuration for CI/CD
pipeline:
  provider: github
